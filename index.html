        ctx.filter = 'brightness(2.6) contrast(1.4)';
      }

      if (this.facing === -1) {
        ctx.translate(drawX + sprite.width, drawY);
        ctx.scale(-1, 1);
        ctx.drawImage(sprite, 0, 0);
      } else {
        ctx.drawImage(sprite, drawX, drawY);
      }
      ctx.restore();

      // Overhead mini HP bar for damaged non-boss enemies
      if (!this.isBoss && this.hp < this.maxHp) {
        const bw = 30;
        const bh = 4;
        const bx = Math.floor(this.cx - bw * 0.5 - cam.x);
        const by = Math.floor(this.y - 10 - cam.y);
        ctx.fillStyle = '#09040a';
        ctx.fillRect(bx - 1, by - 1, bw + 2, bh + 2);
        ctx.fillStyle = '#c4182f';
        ctx.fillRect(bx, by, Math.ceil((this.hp / this.maxHp) * bw), bh);
      }
    }
  }

  function createEnemyByType(type, x, y) {
    const defs = {
      skeleton: { w: 22, h: 38, hp: 58, damage: 14, speed: 105, xp: 30, score: 120, name: 'Skeleton Warrior' },
      bat:      { w: 26, h: 20, hp: 36, damage: 11, speed: 135, xp: 24, score: 100, flying: true, name: 'Demon Bat' },
      golem:    { w: 36, h: 46, hp: 135, damage: 22, speed: 64, xp: 65, score: 260, name: 'Fire Golem' },
      dog:      { w: 34, h: 24, hp: 64, damage: 16, speed: 175, xp: 35, score: 150, name: 'Shadow Dog' },
      beet:     { w: 24, h: 28, hp: 46, damage: 13, speed: 120, xp: 28, score: 110, name: 'Cursed Beet' },
      boss:     { w: 68, h: 98, hp: 920, damage: 26, speed: 105, xp: 500, score: 2500, isBoss: true, name: 'Malakor, Lord of Sin' }
    };
    const d = defs[type] || defs.skeleton;
    return new Enemy(x, y - d.h, d.w, d.h, type, d);
  }


  // ============================================================================
  // 10. LEVEL DESIGN (3 FLOORS + PROCEDURAL PLATFORMS + TORCHES + PORTALS + LAVA)
  // ============================================================================
  // Tile Codes:
  // 0 = empty, 1 = solid stone/theme, 2 = one-way platform, 3 = spikes, 4 = lava
  class MovingPlatform {
    constructor(x, y, w, rangeX, rangeY, speed) {
      this.x = x;
      this.y = y;
      this.startX = x;
      this.startY = y;
      this.w = w;
      this.h = 14;
      this.rangeX = rangeX;
      this.rangeY = rangeY;
      this.speed = speed;
      this.t = MathUtil.rand(0, Math.PI * 2);
      this.dx = 0;
      this.dy = 0;
    }

    update(dt) {
      const prevX = this.x;
      const prevY = this.y;
      this.t += dt * this.speed;
      this.x = this.startX + Math.sin(this.t) * this.rangeX;
      this.y = this.startY + Math.cos(this.t) * this.rangeY;
      this.dx = this.x - prevX;
      this.dy = this.y - prevY;
    }

    render(ctx, cam, atlas) {
      const sx = Math.floor(this.x - cam.x);
      const sy = Math.floor(this.y - cam.y);
      const count = Math.ceil(this.w / TILE_SIZE);
      for (let i = 0; i < count; i++) {
        ctx.drawImage(atlas.tiles.platform, sx + i * TILE_SIZE, sy);
      }
    }
  }

  class Level {
    constructor(index) {
      this.index = index; // 0: Castle Entrance, 1: Infernal Caverns, 2: Throne of Sin
      this.cols = 0;
      this.rows = 20;
      this.grid = [];
      this.torches = [];
      this.chains = [];
      this.arches = [];
      this.bloodPools = [];
      this.movingPlatforms = [];
      this.enemySpawns = [];
      this.portal = null;
      this.spawnX = 96;
      this.spawnY = 400;
      this.theme = 'castle';
      this.name = '';
      this.subtitle = '';
      this.darknessAlpha = 0.62;
      this.buildLevel(index);
    }

    get pixelWidth() { return this.cols * TILE_SIZE; }
    get pixelHeight() { return this.rows * TILE_SIZE; }

    buildLevel(index) {
      const rng = createRNG(9001 + index * 777);
      if (index === 0) {
        this.theme = 'castle';
        this.name = 'FLOOR I: CASTLE ENTRANCE';
        this.subtitle = 'Ancient Corridors of Despair';
        this.cols = 92;
        this.rows = 19;
        this.darknessAlpha = 0.56;
      } else if (index === 1) {
        this.theme = 'caverns';
        this.name = 'FLOOR II: INFERNAL CAVERNS';
        this.subtitle = 'Molten Abyss & Brimstone';
        this.cols = 104;
        this.rows = 20;
        this.darknessAlpha = 0.64;
      } else {
        this.theme = 'throne';
        this.name = 'FLOOR III: THRONE OF SIN';
        this.subtitle = 'Sanctum of Malakor';
        this.cols = 58;
        this.rows = 19;
        this.darknessAlpha = 0.52;
      }

      this.grid = Array.from({ length: this.rows }, () => new Uint8Array(this.cols));

      // Outer walls & ceiling
      for (let c = 0; c < this.cols; c++) {
        this.grid[0][c] = 1;
        this.grid[1][c] = 1;
      }
      for (let r = 0; r < this.rows; r++) {
        this.grid[r][0] = 1;
        this.grid[r][this.cols - 1] = 1;
      }

      if (index === 0) this.generateCastleEntrance(rng);
      else if (index === 1) this.generateInfernalCaverns(rng);
      else this.generateThroneOfSin(rng);
    }

    fillRect(c0, r0, w, h, tile) {
      for (let r = r0; r < r0 + h; r++) {
        if (r < 0 || r >= this.rows) continue;
        for (let c = c0; c < c0 + w; c++) {
          if (c < 0 || c >= this.cols) continue;
          this.grid[r][c] = tile;
        }
      }
    }

    generateCastleEntrance(rng) {
      const groundRow = this.rows - 3; // row 16
      this.fillRect(1, groundRow, this.cols - 2, 3, 1);

      this.spawnX = 3 * TILE_SIZE;
      this.spawnY = (groundRow - 2) * TILE_SIZE;

      // Hand-crafted gothic castle segments with procedural platform pockets
      // Raised stone battlements
      this.fillRect(14, groundRow - 2, 6, 2, 1);
      this.fillRect(28, groundRow - 3, 8, 3, 1);
      this.fillRect(46, groundRow - 2, 7, 2, 1);
      this.fillRect(62, groundRow - 4, 9, 4, 1);
      this.fillRect(79, groundRow - 2, 11, 2, 1);

      // Pit + spike traps with bridges
      this.fillRect(22, groundRow, 4, 3, 0);
      this.fillRect(22, groundRow + 1, 4, 2, 1);
      this.fillRect(22, groundRow, 4, 1, 3); // spikes in trench
      this.fillRect(21, groundRow - 2, 5, 1, 2); // bridge platform

      this.fillRect(55, groundRow, 5, 3, 0);
      this.fillRect(55, groundRow + 1, 5, 2, 1);
      this.fillRect(55, groundRow, 5, 1, 3);
      this.fillRect(56, groundRow - 3, 3, 1, 2);

      // Procedural upper wooden/iron balconies
      for (let c = 10; c < this.cols - 14; c += 12) {
        const platW = rng() > 0.45 ? 4 : 3;
        const platR = groundRow - (rng() > 0.5 ? 5 : 6);
        this.fillRect(c, platR, platW, 1, 2);
        if (rng() > 0.35) {
          this.enemySpawns.push({ type: rng() > 0.5 ? 'bat' : 'skeleton', x: (c + 1) * TILE_SIZE, y: platR * TILE_SIZE - 16 });
        }
      }

      // Decor: Torches, gothic arches, hanging chains, blood pools
      for (let c = 5; c < this.cols - 5; c += 7) {
        const floorR = this.findSurfaceRow(c);
        this.torches.push({ x: c * TILE_SIZE + 16, y: (floorR - 3) * TILE_SIZE });
        if (c % 14 === 5) {
          this.arches.push({ x: c * TILE_SIZE, y: 2 * TILE_SIZE, w: 4 * TILE_SIZE, h: (floorR - 2) * TILE_SIZE });
        }
        if (rng() > 0.4) {
          this.chains.push({ x: (c + 2) * TILE_SIZE + 12, y: 2 * TILE_SIZE, len: MathUtil.randInt(48, 128) });
        }
        if (rng() > 0.55) {
          this.bloodPools.push({ x: (c + 1) * TILE_SIZE, y: floorR * TILE_SIZE - 2, w: MathUtil.randInt(28, 64) });
        }
      }

      // Enemy placements along Castle Entrance (tutorial-friendly progression)
      const castleRoster = [
        ['skeleton', 16], ['beet', 20], ['skeleton', 31], ['bat', 35],
        ['dog', 41], ['skeleton', 48], ['beet', 51], ['bat', 60],
        ['dog', 65], ['skeleton', 68], ['golem', 74], ['dog', 81]
      ];
      for (const [type, col] of castleRoster) {
        const surf = this.findSurfaceRow(col);
        this.enemySpawns.push({
          type,
          x: col * TILE_SIZE,
          y: type === 'bat' ? (surf - 4) * TILE_SIZE : surf * TILE_SIZE
        });
      }

      // Transition Portal to Floor 2
      const pCol = this.cols - 6;
      const pRow = this.findSurfaceRow(pCol);
      this.portal = { x: pCol * TILE_SIZE, y: pRow * TILE_SIZE - 68, w: 42, h: 68, active: true };
    }

    generateInfernalCaverns(rng) {
      const groundRow = this.rows - 3; // row 17
      // Base floor with molten lava chasms
      this.fillRect(1, groundRow, 14, 3, 1);
      // Lava chasm 1
      this.fillRect(15, groundRow + 1, 14, 2, 4);
      // Mid island
      this.fillRect(29, groundRow - 1, 12, 4, 1);
      // Lava chasm 2
      this.fillRect(41, groundRow + 1, 18, 2, 4);
      // Fortress bridge island
      this.fillRect(59, groundRow - 2, 15, 5, 1);
      // Lava chasm 3
      this.fillRect(74, groundRow + 1, 13, 2, 4);
      // Exit obsidian cliff
      this.fillRect(87, groundRow - 1, 16, 4, 1);

      this.spawnX = 3 * TILE_SIZE;
      this.spawnY = (groundRow - 2) * TILE_SIZE;

      // Static stepping stone islands + procedural ledges over lava
      this.fillRect(18, groundRow - 2, 4, 1, 2);
      this.fillRect(45, groundRow - 3, 4, 1, 2);
      this.fillRect(78, groundRow - 2, 4, 1, 2);

      for (let c = 10; c < this.cols - 12; c += 11) {
        const pr = groundRow - (4 + Math.floor(rng() * 3));
        const pw = MathUtil.randInt(3, 5);
        this.fillRect(c, pr, pw, 1, 2);
      }

      // Moving platforms across the lava pits!
      this.movingPlatforms.push(new MovingPlatform(23 * TILE_SIZE, (groundRow - 2) * TILE_SIZE, 96, 65, 0, 1.8));
      this.movingPlatforms.push(new MovingPlatform(50 * TILE_SIZE, (groundRow - 2) * TILE_SIZE, 96, 0, 48, 2.0));
      this.movingPlatforms.push(new MovingPlatform(81 * TILE_SIZE, (groundRow - 3) * TILE_SIZE, 96, 55, 22, 1.7));

      // Torches & chains
      for (let c = 4; c < this.cols - 4; c += 8) {
        const surf = this.findSurfaceRow(c);
        if (surf < this.rows - 1) {
          this.torches.push({ x: c * TILE_SIZE + 16, y: (surf - 3) * TILE_SIZE });
        }
        if (rng() > 0.35) {
          this.chains.push({ x: (c + 3) * TILE_SIZE + 10, y: 2 * TILE_SIZE, len: MathUtil.randInt(54, 150) });
        }
      }

      // Enemies: Heavy Fire Golems, Demon Bats, Shadow Dogs, Beetroots
      const cavernRoster = [
        ['golem', 10], ['bat', 20], ['dog', 32], ['golem', 37],
        ['bat', 47], ['beet', 62], ['golem', 66], ['dog', 70],
        ['bat', 80], ['golem', 90], ['dog', 94]
      ];
      for (const [type, col] of cavernRoster) {
        const surf = this.findSurfaceRow(col);
        this.enemySpawns.push({
          type,
          x: col * TILE_SIZE,
          y: type === 'bat' ? (groundRow - 5) * TILE_SIZE : surf * TILE_SIZE
        });
      }

      const pCol = this.cols - 6;
      const pRow = this.findSurfaceRow(pCol);
      this.portal = { x: pCol * TILE_SIZE, y: pRow * TILE_SIZE - 68, w: 42, h: 68, active: true };
    }

    generateThroneOfSin(rng) {
      const groundRow = this.rows - 3; // row 16
      this.fillRect(1, groundRow, this.cols - 2, 3, 1);

      this.spawnX = 4 * TILE_SIZE;
      this.spawnY = (groundRow - 2) * TILE_SIZE;

      // Symmetrical Boss Arena Platforms for tactical vertical dodging
      this.fillRect(9, groundRow - 4, 5, 1, 2);
      this.fillRect(25, groundRow - 6, 8, 1, 2);
      this.fillRect(44, groundRow - 4, 5, 1, 2);
      this.fillRect(17, groundRow - 3, 4, 1, 2);
      this.fillRect(37, groundRow - 3, 4, 1, 2);

      // Grand Throne Dais on right side
      this.fillRect(this.cols - 8, groundRow - 1, 7, 1, 1);

      // Ornate torches & arches
      for (let c = 4; c < this.cols - 4; c += 6) {
        this.torches.push({ x: c * TILE_SIZE + 16, y: (groundRow - 3) * TILE_SIZE });
        if (c % 12 === 4) {
          this.arches.push({ x: c * TILE_SIZE, y: 2 * TILE_SIZE, w: 4 * TILE_SIZE, h: (groundRow - 2) * TILE_SIZE });
        }
      }
      for (let c = 10; c < this.cols - 10; c += 9) {
        this.chains.push({ x: c * TILE_SIZE, y: 2 * TILE_SIZE, len: MathUtil.randInt(60, 120) });
      }
      this.bloodPools.push({ x: 24 * TILE_SIZE, y: groundRow * TILE_SIZE - 2, w: 120 });

      // Boss + 2 Skeleton honor guards
      this.enemySpawns.push({ type: 'skeleton', x: 20 * TILE_SIZE, y: groundRow * TILE_SIZE });
      this.enemySpawns.push({ type: 'bat', x: 30 * TILE_SIZE, y: (groundRow - 8) * TILE_SIZE });
      this.enemySpawns.push({ type: 'boss', x: 43 * TILE_SIZE, y: groundRow * TILE_SIZE });

      // Portal appears/unlocks only once Demon Lord is slain!
      this.portal = { x: (this.cols - 5) * TILE_SIZE, y: (groundRow - 1) * TILE_SIZE - 68, w: 42, h: 68, active: false };
    }

    findSurfaceRow(col) {
      col = MathUtil.clamp(col, 1, this.cols - 2);
      for (let r = 3; r < this.rows; r++) {
        if (this.grid[r][col] === 1) return r;
      }
      return this.rows - 3;
    }

    getTile(c, r) {
      if (c < 0 || c >= this.cols || r < 0 || r >= this.rows) return 1;
      return this.grid[r][c];
    }

    isPointSolid(px, py) {
      const c = Math.floor(px / TILE_SIZE);
      const r = Math.floor(py / TILE_SIZE);
      return this.getTile(c, r) === 1;
    }

    isRectSolid(x, y, w, h) {
      const c0 = Math.floor(x / TILE_SIZE);
      const c1 = Math.floor((x + w - 0.01) / TILE_SIZE);
      const r0 = Math.floor(y / TILE_SIZE);
      const r1 = Math.floor((y + h - 0.01) / TILE_SIZE);
      for (let r = r0; r <= r1; r++) {
        for (let c = c0; c <= c1; c++) {
          if (this.getTile(c, r) === 1) return true;
        }
      }
      return false;
    }

    checkHazardCollision(rect) {
      const c0 = Math.floor((rect.x + 4) / TILE_SIZE);
      const c1 = Math.floor((rect.x + rect.w - 4) / TILE_SIZE);
      const r0 = Math.floor((rect.y + 6) / TILE_SIZE);
      const r1 = Math.floor((rect.y + rect.h - 2) / TILE_SIZE);
      for (let r = r0; r <= r1; r++) {
        for (let c = c0; c <= c1; c++) {
          const t = this.getTile(c, r);
          if (t === 3 || t === 4) return true;
        }
      }
      return false;
    }

    resolveHorizontal(ent) {
      let hit = false;
      const c0 = Math.floor(ent.x / TILE_SIZE);
      const c1 = Math.floor((ent.x + ent.w - 0.01) / TILE_SIZE);
      const r0 = Math.floor(ent.y / TILE_SIZE);
      const r1 = Math.floor((ent.y + ent.h - 0.01) / TILE_SIZE);
      for (let r = r0; r <= r1; r++) {
        for (let c = c0; c <= c1; c++) {
          if (this.getTile(c, r) === 1) {
            if (ent.vx > 0) ent.x = c * TILE_SIZE - ent.w;
            else if (ent.vx < 0) ent.x = (c + 1) * TILE_SIZE;
            ent.vx = 0;
            hit = true;
          }
        }
      }
      return hit;
    }

    resolveVertical(ent, dropThrough = false) {
      let landed = false;
      const c0 = Math.floor(ent.x / TILE_SIZE);
      const c1 = Math.floor((ent.x + ent.w - 0.01) / TILE_SIZE);
      const r0 = Math.floor(ent.y / TILE_SIZE);
      const r1 = Math.floor((ent.y + ent.h - 0.01) / TILE_SIZE);

      for (let r = r0; r <= r1; r++) {
        for (let c = c0; c <= c1; c++) {
          const tile = this.getTile(c, r);
          if (tile === 1) {
            if (ent.vy > 0) {
              ent.y = r * TILE_SIZE - ent.h;
              ent.vy = 0;
              landed = true;
            } else if (ent.vy < 0) {
              ent.y = (r + 1) * TILE_SIZE;
              ent.vy = 0;
            }
          } else if (tile === 2 && !dropThrough && ent.vy >= 0) {
            const platTop = r * TILE_SIZE;
            // Land only if feet were near or above platform top
            if (ent.y + ent.h - ent.vy * 0.025 <= platTop + 10) {
              ent.y = platTop - ent.h;
              ent.vy = 0;
              landed = true;
            }
          }
        }
      }

      // Check moving platforms (player & ground enemies)
      if (!dropThrough && ent.vy >= 0) {
        for (const mp of this.movingPlatforms) {
          if (
            ent.x + ent.w > mp.x &&
            ent.x < mp.x + mp.w &&
            ent.y + ent.h >= mp.y &&
            ent.y + ent.h <= mp.y + 16
          ) {
            ent.y = mp.y - ent.h;
            ent.vy = 0;
            ent.x += mp.dx;
            landed = true;
          }
        }
      }

      return landed;
    }

    update(dt, particles) {
      for (const mp of this.movingPlatforms) mp.update(dt);

      // Ambient torch embers
      for (const torch of this.torches) {
        if (Math.random() < dt * 7) {
          particles.spawnEmber(torch.x, torch.y - 6);
        }
      }

      // Ambient lava embers on Infernal Caverns
      if (this.theme === 'caverns' && Math.random() < dt * 16) {
        const rx = MathUtil.rand(15 * TILE_SIZE, 86 * TILE_SIZE);
        particles.spawnEmber(rx, (this.rows - 2) * TILE_SIZE, ['#ffaa33', '#ff4d1a']);
      }
    }

    renderBackgroundDecor(ctx, cam, atlas, time) {
      // Gothic arches
      for (const arch of this.arches) {
        const sx = Math.floor(arch.x - cam.x);
        const sy = Math.floor(arch.y - cam.y);
        if (sx + arch.w < 0 || sx > GAME_WIDTH) continue;

        ctx.fillStyle = this.theme === 'throne' ? '#1c0813' : '#130e1c';
        ctx.fillRect(sx, sy, 18, arch.h);
        ctx.fillRect(sx + arch.w - 18, sy, 18, arch.h);
        ctx.beginPath();
        ctx.arc(sx + arch.w * 0.5, sy + 52, arch.w * 0.5, Math.PI, 0);
        ctx.lineWidth = 14;
        ctx.strokeStyle = this.theme === 'throne' ? '#2c0b1c' : '#1f182d';
        ctx.stroke();
      }

      // Hanging chains
      ctx.strokeStyle = '#3b3e4a';
      ctx.lineWidth = 2;
      for (const ch of this.chains) {
        const sx = Math.floor(ch.x - cam.x);
        const sy = Math.floor(ch.y - cam.y);
        if (sx < -10 || sx > GAME_WIDTH + 10) continue;
        const sway = Math.sin(time * 1.4 + ch.x * 0.05) * 3;
        ctx.beginPath();
        ctx.moveTo(sx, sy);
        ctx.lineTo(sx + sway, sy + ch.len);
        ctx.stroke();
        // Links
        for (let yy = 0; yy < ch.len; yy += 8) {
          ctx.fillStyle = '#5c6273';
          ctx.fillRect(sx + sway * (yy / ch.len) - 2, sy + yy, 4, 5);
        }
      }

      // Blood pools on floors
      ctx.fillStyle = '#6b0716';
      for (const bp of this.bloodPools) {
        const sx = Math.floor(bp.x - cam.x);
        const sy = Math.floor(bp.y - cam.y);
        if (sx + bp.w < 0 || sx > GAME_WIDTH) continue;
        ctx.fillRect(sx, sy, bp.w, 4);
        ctx.fillStyle = '#9c0c22';
        ctx.fillRect(sx + 4, sy, Math.max(4, bp.w - 10), 2);
        ctx.fillStyle = '#6b0716';
      }

      // Wall Torches with animated procedural flame
      for (const t of this.torches) {
        const sx = Math.floor(t.x - cam.x);
        const sy = Math.floor(t.y - cam.y);
        if (sx < -40 || sx > GAME_WIDTH + 40) continue;

        // Iron sconce bracket
        ctx.fillStyle = '#322b38';
        ctx.fillRect(sx - 3, sy, 6, 18);
        ctx.fillStyle = '#5a4d63';
        ctx.fillRect(sx - 5, sy - 2, 10, 4);

        // Flickering fire
        const flick = Math.sin(time * 18 + t.x) * 2.5;
        ctx.fillStyle = '#d9380b';
        ctx.fillRect(sx - 5, sy - 11 + flick * 0.3, 10, 10);
        ctx.fillStyle = '#ff8c1a';
        ctx.fillRect(sx - 4, sy - 14 + flick * 0.5, 8, 9);
        ctx.fillStyle = '#ffe978';
        ctx.fillRect(sx - 2, sy - 12 + flick * 0.4, 4, 6);
      }

      // Portal rendering
      if (this.portal) {
        const p = this.portal;
        const sx = Math.floor(p.x - cam.x);
        const sy = Math.floor(p.y - cam.y);
        // Stone portal frame
        ctx.fillStyle = '#2d2438';
        ctx.fillRect(sx - 6, sy - 6, p.w + 12, p.h + 6);
        ctx.fillStyle = '#4f4261';
        ctx.fillRect(sx - 3, sy - 3, p.w + 6, p.h + 3);

        if (p.active) {
          const pulse = Math.sin(time * 5) * 4;
          const grad = ctx.createRadialGradient(sx + p.w * 0.5, sy + p.h * 0.5, 4, sx + p.w * 0.5, sy + p.h * 0.5, 36 + pulse);
          grad.addColorStop(0, '#ffffff');
          grad.addColorStop(0.35, this.theme === 'throne' ? '#ffcf54' : '#52b8ff');
          grad.addColorStop(0.8, this.theme === 'throne' ? '#b81d38' : '#2623a6');
          grad.addColorStop(1, '#09040d');
          ctx.fillStyle = grad;
          ctx.fillRect(sx, sy, p.w, p.h);

          // Swirling runes
          ctx.strokeStyle = 'rgba(255,255,255,0.65)';
          ctx.lineWidth = 2;
          ctx.beginPath();
          ctx.ellipse(sx + p.w * 0.5, sy + p.h * 0.5, 12 + Math.sin(time * 4) * 3, 24, time * 2, 0, Math.PI * 2);
          ctx.stroke();
        } else {
          ctx.fillStyle = '#0e0712';
          ctx.fillRect(sx, sy, p.w, p.h);
        }
      }
    }

    renderTiles(ctx, cam, atlas, time) {
      const cStart = Math.max(0, Math.floor(cam.x / TILE_SIZE));
      const cEnd = Math.min(this.cols - 1, Math.ceil((cam.x + GAME_WIDTH) / TILE_SIZE));
      const rStart = Math.max(0, Math.floor(cam.y / TILE_SIZE));
      const rEnd = Math.min(this.rows - 1, Math.ceil((cam.y + GAME_HEIGHT) / TILE_SIZE));

      const solidTile = this.theme === 'caverns'
        ? atlas.tiles.infernal
        : (this.theme === 'throne' ? atlas.tiles.throne : atlas.tiles.stone);
      const topTile = this.theme === 'caverns'
        ? atlas.tiles.infernalTop
        : (this.theme === 'throne' ? atlas.tiles.throneTop : atlas.tiles.stoneTop);

      for (let r = rStart; r <= rEnd; r++) {
        for (let c = cStart; c <= cEnd; c++) {
          const tile = this.grid[r][c];
          if (tile === 0) continue;
          const sx = Math.floor(c * TILE_SIZE - cam.x);
          const sy = Math.floor(r * TILE_SIZE - cam.y);

          if (tile === 1) {
            const aboveEmpty = this.getTile(c, r - 1) !== 1;
            ctx.drawImage(aboveEmpty ? topTile : solidTile, sx, sy);
          } else if (tile === 2) {
            ctx.drawImage(atlas.tiles.platform, sx, sy);
          } else if (tile === 3) {
            ctx.drawImage(atlas.tiles.spikes, sx, sy);
          } else if (tile === 4) {
            // Animated bubbling lava tile
            const wave = Math.sin(time * 5 + c * 0.8) * 2;
            ctx.fillStyle = '#991b08';
            ctx.fillRect(sx, sy + 2, TILE_SIZE, TILE_SIZE - 2);
            ctx.fillStyle = '#e84d10';
            ctx.fillRect(sx, sy + 2 + wave * 0.5, TILE_SIZE, 8);
            ctx.fillStyle = '#ffd24d';
            ctx.fillRect(sx + ((c * 9 + Math.floor(time * 8)) % 20), sy + 3 + wave * 0.5, 8, 3);
          }
        }
      }

      for (const mp of this.movingPlatforms) {
        mp.render(ctx, cam, atlas);
      }
    }
  }


  // ============================================================================
  // 11. PARALLAX GOTHIC BACKGROUND & DYNAMIC LIGHTING SYSTEM
  // ============================================================================
  class WorldRenderer {
    constructor() {
      this.lightCanvas = document.createElement('canvas');
      this.lightCanvas.width = GAME_WIDTH;
      this.lightCanvas.height = GAME_HEIGHT;
      this.lightCtx = this.lightCanvas.getContext('2d');

      this.lightningTimer = 4.0;
      this.lightningFlash = 0;
      this.lightningBolt = null;
    }

    update(dt) {
      this.lightningTimer -= dt;
      if (this.lightningTimer <= 0) {
        this.lightningTimer = MathUtil.rand(5.0, 12.0);
        this.lightningFlash = 0.65;
        // Generate jagged lightning bolt in sky
        const startX = MathUtil.rand(140, GAME_WIDTH - 140);
        const pts = [{ x: startX, y: 0 }];
        let curX = startX;
        let curY = 0;
        while (curY < 260) {
          curX += MathUtil.rand(-28, 28);
          curY += MathUtil.rand(22, 42);
          pts.push({ x: curX, y: curY });
        }
        this.lightningBolt = pts;
      }
      if (this.lightningFlash > 0) {
        this.lightningFlash = Math.max(0, this.lightningFlash - dt * 2.2);
      }
    }

    renderParallaxBackground(ctx, cam, level, time) {
      // Sky gradient per floor theme
      const skyGrad = ctx.createLinearGradient(0, 0, 0, GAME_HEIGHT);
      if (level.theme === 'caverns') {
        skyGrad.addColorStop(0, '#0f0307');
        skyGrad.addColorStop(0.55, '#290910');
        skyGrad.addColorStop(1, '#4f120b');
      } else if (level.theme === 'throne') {
        skyGrad.addColorStop(0, '#0b030e');
        skyGrad.addColorStop(0.6, '#26081d');
        skyGrad.addColorStop(1, '#3d0c1f');
      } else {
        skyGrad.addColorStop(0, '#06030b');
        skyGrad.addColorStop(0.55, '#170a1c');
        skyGrad.addColorStop(1, '#261124');
      }
      ctx.fillStyle = skyGrad;
      ctx.fillRect(0, 0, GAME_WIDTH, GAME_HEIGHT);

      // Lightning sky flash
      if (this.lightningFlash > 0 && level.theme !== 'caverns') {
        ctx.fillStyle = `rgba(210, 180, 255, ${this.lightningFlash * 0.22})`;
        ctx.fillRect(0, 0, GAME_WIDTH, GAME_HEIGHT);
        if (this.lightningBolt && this.lightningFlash > 0.25) {
          ctx.save();
          ctx.strokeStyle = `rgba(235, 225, 255, ${this.lightningFlash})`;
          ctx.lineWidth = 2.5;
          ctx.beginPath();
          this.lightningBolt.forEach((p, idx) => {
            if (idx === 0) ctx.moveTo(p.x, p.y);
            else ctx.lineTo(p.x, p.y);
          });
          ctx.stroke();
          ctx.restore();
        }
      }

      // Blood-Red Moon (visible on Castle Entrance & Throne stained windows)
      if (level.theme !== 'caverns') {
        const moonX = GAME_WIDTH * 0.76 - cam.x * 0.03;
        const moonY = 98;
        const moonGlow = ctx.createRadialGradient(moonX, moonY, 16, moonX, moonY, 125);
        moonGlow.addColorStop(0, 'rgba(220, 35, 55, 0.45)');
        moonGlow.addColorStop(1, 'rgba(220, 35, 55, 0)');
        ctx.fillStyle = moonGlow;
        ctx.beginPath();
        ctx.arc(moonX, moonY, 125, 0, Math.PI * 2);
        ctx.fill();

        ctx.fillStyle = '#ba182e';
        ctx.beginPath();
        ctx.arc(moonX, moonY, 40, 0, Math.PI * 2);
        ctx.fill();
        ctx.fillStyle = '#e0364c';
        ctx.beginPath();
        ctx.arc(moonX - 6, moonY - 5, 32, 0, Math.PI * 2);
        ctx.fill();
        // Moon craters
        ctx.fillStyle = 'rgba(90, 8, 22, 0.45)';
        ctx.fillRect(moonX + 6, moonY - 12, 10, 8);
        ctx.fillRect(moonX - 18, moonY + 6, 12, 7);
      }

      // Distant Parallax Layer 1: Gothic Cathedral Silhouettes & Towers (0.12x)
      const p1Offset = -(cam.x * 0.12) % 240;
      ctx.fillStyle = level.theme === 'caverns' ? '#1c060b' : '#100716';
      for (let x = p1Offset - 240; x < GAME_WIDTH + 240; x += 240) {
        ctx.fillRect(x + 20, 140, 68, 400);
        // Spire
        ctx.beginPath();
        ctx.moveTo(x + 15, 140);
        ctx.lineTo(x + 54, 48);
        ctx.lineTo(x + 93, 140);
        ctx.closePath();
        ctx.fill();
        // Secondary battlement tower
        ctx.fillRect(x + 125, 190, 85, 350);
        for (let b = 0; b < 85; b += 20) {
          ctx.fillRect(x + 125 + b, 178, 12, 14);
        }
        // Glowing distant stained window
        ctx.fillStyle = level.theme === 'caverns' ? '#7a1912' : '#4a1026';
        ctx.fillRect(x + 48, 175, 12, 26);
        ctx.fillStyle = level.theme === 'caverns' ? '#1c060b' : '#100716';
      }

      // Parallax Layer 2: Drifting Crimson Mist / Clouds (0.25x)
      const mistOffset = -(cam.x * 0.24 + time * 14) % 320;
      ctx.fillStyle = level.theme === 'caverns'
        ? 'rgba(180, 45, 15, 0.11)'
        : 'rgba(105, 22, 55, 0.13)';
      for (let x = mistOffset - 320; x < GAME_WIDTH + 320; x += 320) {
        ctx.beginPath();
        ctx.ellipse(x + 120, 290, 160, 42, 0, 0, Math.PI * 2);
        ctx.fill();
        ctx.beginPath();
        ctx.ellipse(x + 260, 350, 140, 34, 0, 0, Math.PI * 2);
        ctx.fill();
      }

      // Parallax Layer 3: Near Castle Buttresses & Pillars (0.45x)
      const p3Offset = -(cam.x * 0.45) % 280;
      ctx.fillStyle = level.theme === 'caverns' ? '#17070c' : '#150d1c';
      for (let x = p3Offset - 280; x < GAME_WIDTH + 280; x += 280) {
        ctx.fillRect(x + 40, 60, 34, GAME_HEIGHT);
        ctx.fillRect(x + 190, 90, 26, GAME_HEIGHT);
      }
    }

    renderLighting(ctx, cam, level, player, projectiles, time) {
      const lctx = this.lightCtx;
      lctx.clearRect(0, 0, GAME_WIDTH, GAME_HEIGHT);

      // Ambient darkness overlay
      lctx.fillStyle = `rgba(5, 2, 10, ${level.darknessAlpha})`;
      lctx.fillRect(0, 0, GAME_WIDTH, GAME_HEIGHT);

      // Cut out soft radial lights using destination-out
      lctx.globalCompositeOperation = 'destination-out';

      const punchLight = (wx, wy, radius, intensity = 1) => {
        const sx = wx - cam.x;
        const sy = wy - cam.y;
        if (sx < -radius || sy < -radius || sx > GAME_WIDTH + radius || sy > GAME_HEIGHT + radius) return;
        const g = lctx.createRadialGradient(sx, sy, radius * 0.1, sx, sy, radius);
        g.addColorStop(0, `rgba(255, 255, 255, ${intensity})`);
        g.addColorStop(0.55, `rgba(255, 255, 255, ${intensity * 0.55})`);
        g.addColorStop(1, 'rgba(255, 255, 255, 0)');
        lctx.fillStyle = g;
        lctx.beginPath();
        lctx.arc(sx, sy, radius, 0, Math.PI * 2);
        lctx.fill();
      };

      // Player aura light
      punchLight(player.cx, player.cy, 210, 0.95);

      // Dynamic flickering torch lights
      for (const t of level.torches) {
        const flick = Math.sin(time * 15 + t.x * 0.2) * 14;
        punchLight(t.x, t.y - 8, 145 + flick, 0.9);
      }

      // Portal light
      if (level.portal && level.portal.active) {
        punchLight(level.portal.x + 21, level.portal.y + 34, 155, 0.95);
      }

      // Projectiles light
      for (const p of projectiles) {
        punchLight(p.cx, p.cy, 72, 0.85);
      }

      lctx.globalCompositeOperation = 'source-over';
      ctx.drawImage(this.lightCanvas, 0, 0);

      // Warm additive glow blooms on torches & player magic
      ctx.save();
      ctx.globalCompositeOperation = 'lighter';
      for (const t of level.torches) {
        const sx = t.x - cam.x;
        const sy = t.y - 8 - cam.y;
        if (sx < -130 || sx > GAME_WIDTH + 130) continue;
        const flick = Math.sin(time * 19 + t.x) * 8;
        const g = ctx.createRadialGradient(sx, sy, 2, sx, sy, 92 + flick);
        g.addColorStop(0, 'rgba(255, 175, 65, 0.34)');
        g.addColorStop(0.5, 'rgba(230, 80, 20, 0.12)');
        g.addColorStop(1, 'rgba(0, 0, 0, 0)');
        ctx.fillStyle = g;
        ctx.beginPath();
        ctx.arc(sx, sy, 92 + flick, 0, Math.PI * 2);
        ctx.fill();
      }
      ctx.restore();
    }
  }

  // ============================================================================
  // 12. HUD, MINIMAP, TITLE SCREEN, PAUSE, DEATH & VICTORY SCREENS
  // ============================================================================
  class UIRenderer {
    constructor() {
      this.menuIndex = 0;
      this.menuFlames = Array.from({ length: 45 }, () => ({
        x: MathUtil.rand(0, GAME_WIDTH),
        y: MathUtil.rand(GAME_HEIGHT * 0.55, GAME_HEIGHT),
        vy: MathUtil.rand(-80, -25),
        sz: MathUtil.rand(3, 8),
        life: MathUtil.rand(0.4, 1.5)
      }));
    }

    drawGothicText(ctx, text, x, y, size, color = '#e6d8c5', glowColor = null, align = 'center') {
      ctx.save();
      ctx.font = `bold ${size}px "Georgia", "Times New Roman", serif`;
      ctx.textAlign = align;
      ctx.textBaseline = 'middle';
      if (glowColor) {
        ctx.shadowColor = glowColor;
        ctx.shadowBlur = 18;
      }
      ctx.fillStyle = '#09030a';
      ctx.fillText(text, x + 3, y + 3);
      ctx.fillStyle = color;
      ctx.fillText(text, x, y);
      ctx.restore();
    }

    renderTitleScreen(ctx, time, dt, audioMuted, showControls) {
      // Dark gothic castle backdrop
      const g = ctx.createLinearGradient(0, 0, 0, GAME_HEIGHT);
      g.addColorStop(0, '#07020a');
      g.addColorStop(0.55, '#1d0715');
      g.addColorStop(1, '#3b0a14');
      ctx.fillStyle = g;
      ctx.fillRect(0, 0, GAME_WIDTH, GAME_HEIGHT);

      // Massive red moon behind castle silhouette
      ctx.fillStyle = '#991229';
      ctx.beginPath();
      ctx.arc(GAME_WIDTH * 0.5, 195, 118, 0, Math.PI * 2);
      ctx.fill();
      ctx.fillStyle = '#c4213b';
      ctx.beginPath();
      ctx.arc(GAME_WIDTH * 0.5 - 12, 185, 96, 0, Math.PI * 2);
      ctx.fill();

      // Gothic spire silhouette
      ctx.fillStyle = '#0c050e';
      ctx.fillRect(140, 260, 120, 280);
      ctx.fillRect(700, 260, 120, 280);
      ctx.fillRect(280, 310, 400, 230);
      ctx.beginPath();
      ctx.moveTo(125, 260); ctx.lineTo(200, 120); ctx.lineTo(275, 260);
      ctx.moveTo(685, 260); ctx.lineTo(760, 120); ctx.lineTo(835, 260);
      ctx.moveTo(410, 310); ctx.lineTo(480, 175); ctx.lineTo(550, 310);
      ctx.fill();

      // Animated rising flames at bottom
      for (const f of this.menuFlames) {
        f.y += f.vy * dt;
        f.life -= dt * 0.7;
        if (f.y < 290 || f.life <= 0) {
          f.x = MathUtil.rand(0, GAME_WIDTH);
          f.y = GAME_HEIGHT + 10;
          f.life = MathUtil.rand(0.8, 1.8);
          f.sz = MathUtil.rand(3, 9);
        }
        ctx.save();
        ctx.globalCompositeOperation = 'lighter';
        ctx.globalAlpha = MathUtil.clamp(f.life * 0.65, 0, 0.85);
        ctx.fillStyle = f.sz > 6 ? '#ff4d1a' : '#ffbf40';
        ctx.fillRect(f.x, f.y, f.sz, f.sz * 1.4);
        ctx.restore();
      }

      // Ornate Title Banner
      this.drawGothicText(ctx, 'SIN CASTLE', GAME_WIDTH * 0.5, 128, 72, '#f5dec2', '#e82341');
      this.drawGothicText(ctx, 'DESCENT INTO DARKNESS', GAME_WIDTH * 0.5, 184, 21, '#d99e42', '#6e1120');

      // Decorative crimson sword divider
      ctx.fillStyle = '#d99e42';
      ctx.fillRect(GAME_WIDTH * 0.5 - 190, 216, 380, 2);
      ctx.fillStyle = '#e83548';
      ctx.fillRect(GAME_WIDTH * 0.5 - 8, 210, 16, 14);

      // Menu Options
      const options = [
        'ENTER THE CASTLE',
        `AUDIO: ${audioMuted ? 'MUTED' : 'ENABLED'}`,
        `CONTROLS GUIDE: ${showControls ? 'HIDE' : 'VIEW'}`
      ];

      options.forEach((label, idx) => {
        const y = 278 + idx * 46;
        const selected = idx === this.menuIndex;
        if (selected) {
          ctx.fillStyle = 'rgba(168, 24, 46, 0.35)';
          ctx.fillRect(GAME_WIDTH * 0.5 - 180, y - 18, 360, 36);
          ctx.strokeStyle = '#d99e42';
          ctx.lineWidth = 2;
          ctx.strokeRect(GAME_WIDTH * 0.5 - 180, y - 18, 360, 36);
        }
        this.drawGothicText(
          ctx,
          selected ? `»  ${label}  «` : label,
          GAME_WIDTH * 0.5,
          y,
          selected ? 21 : 17,
          selected ? '#ffe49e' : '#b8a99a',
          selected ? '#ff4444' : null
        );
      });

      // Pulsing Press ENTER prompt
      const pulse = 0.55 + Math.sin(time * 5) * 0.45;
      ctx.save();
      ctx.globalAlpha = pulse;
      this.drawGothicText(ctx, 'PRESS ENTER TO START', GAME_WIDTH * 0.5, 434, 18, '#ffcf54', '#a8182e');
      ctx.restore();

      if (showControls) {
        ctx.fillStyle = 'rgba(10, 4, 14, 0.9)';
        ctx.fillRect(140, 245, GAME_WIDTH - 280, 240);
        ctx.strokeStyle = '#d99e42';
        ctx.lineWidth = 2;
        ctx.strokeRect(140, 245, GAME_WIDTH - 280, 240);

        this.drawGothicText(ctx, 'CONTROLS & COMBAT ARTS', GAME_WIDTH * 0.5, 272, 20, '#ffe17d');
        const lines = [
          'MOVE: Arrow Keys / WASD     |  RUN / DODGE ROLL: Hold Shift / Tap Shift',
          'JUMP / DOUBLE-JUMP / WALL-JUMP: Space or W',
          'SWORD 3-HIT COMBO: Z or J   |  ARCANE BOLT (18 MP): X or K',
          'HELLFIRE NOVA SKILL (30 MP): C or L',
          'PAUSE: ESC / P   |   MUTE: M   |   TOGGLE HINTS: H'
        ];
        ctx.font = '14px "Courier New", monospace';
        ctx.textAlign = 'center';
        ctx.fillStyle = '#e6d8c5';
        lines.forEach((ln, i) => ctx.fillText(ln, GAME_WIDTH * 0.5, 316 + i * 30));
        ctx.fillStyle = '#ffaa44';
        ctx.fillText('Press ENTER or ESC to close', GAME_WIDTH * 0.5, 464);
      }

      ctx.font = '12px "Courier New", monospace';
      ctx.fillStyle = '#85748a';
      ctx.textAlign = 'center';
      ctx.fillText('Up/Down: Navigate  |  Enter: Select  |  H: Toggle Hints  |  T: Touch Pad', GAME_WIDTH * 0.5, GAME_HEIGHT - 22);
    }

    renderHUD(ctx, game) {
      const p = game.player;
      const lvl = game.level;

      // Top-Left Status Panel
      ctx.fillStyle = 'rgba(10, 5, 14, 0.78)';
      ctx.fillRect(14, 12, 266, 98);
      ctx.strokeStyle = '#4e3948';
      ctx.lineWidth = 2;
      ctx.strokeRect(14, 12, 266, 98);

      // Level Badge & Score
      ctx.font = 'bold 13px "Courier New", monospace';
      ctx.fillStyle = '#ffe17d';
      ctx.textAlign = 'left';
      ctx.fillText(`LVL ${p.level} KNIGHT`, 24, 30);
      ctx.textAlign = 'right';
      ctx.fillStyle = '#e6d8c5';
      ctx.fillText(`SCORE: ${p.score}`, 270, 30);

      // Health Bar (Red)
      const hpRatio = MathUtil.clamp(p.hp / p.maxHp, 0, 1);
      ctx.fillStyle = '#29070e';
      ctx.fillRect(24, 40, 246, 16);
      const hpGrad = ctx.createLinearGradient(24, 40, 270, 40);
      hpGrad.addColorStop(0, '#960e22');
      hpGrad.addColorStop(1, '#eb344c');
      ctx.fillStyle = hpGrad;
      ctx.fillRect(24, 40, Math.ceil(246 * hpRatio), 16);
      ctx.strokeStyle = '#735863';
      ctx.lineWidth = 1;
      ctx.strokeRect(24, 40, 246, 16);
      ctx.font = 'bold 11px "Courier New", monospace';
      ctx.fillStyle = '#ffffff';
      ctx.textAlign = 'center';
      ctx.fillText(`HP ${Math.ceil(p.hp)} / ${p.maxHp}`, 147, 52);

      // Mana Bar (Blue)
      const mpRatio = MathUtil.clamp(p.mana / p.maxMana, 0, 1);
      ctx.fillStyle = '#09152e';
      ctx.fillRect(24, 62, 246, 14);
      const mpGrad = ctx.createLinearGradient(24, 62, 270, 62);
      mpGrad.addColorStop(0, '#164bb5');
      mpGrad.addColorStop(1, '#4ca6ff');
      ctx.fillStyle = mpGrad;
      ctx.fillRect(24, 62, Math.ceil(246 * mpRatio), 14);
      ctx.strokeStyle = '#476891';
      ctx.strokeRect(24, 62, 246, 14);
      ctx.fillStyle = '#e8f4ff';
      ctx.fillText(`MP ${Math.floor(p.mana)} / ${p.maxMana}`, 147, 73);

      // XP Progress thin bar
      const xpRatio = MathUtil.clamp(p.xp / p.xpToNext, 0, 1);
      ctx.fillStyle = '#1f1526';
      ctx.fillRect(24, 82, 246, 5);
      ctx.fillStyle = '#e0a638';
      ctx.fillRect(24, 82, Math.ceil(246 * xpRatio), 5);

      // Skill Cooldown & Combo Indicators
      const skillReady = p.skillCooldown <= 0 && p.mana >= 30;
      ctx.textAlign = 'left';
      ctx.font = 'bold 11px "Courier New", monospace';
      ctx.fillStyle = skillReady ? '#ffcf54' : '#8a7a8f';
      const cdText = p.skillCooldown > 0
        ? `NOVA [C/L]: ${p.skillCooldown.toFixed(1)}s`
        : (p.mana < 30 ? 'NOVA [C/L]: LOW MP' : 'NOVA [C/L]: READY!');
      ctx.fillText(cdText, 24, 102);

      if (p.comboStep > 0 && p.comboWindowTimer > 0) {
        ctx.textAlign = 'right';
        ctx.fillStyle = '#ff8a47';
        ctx.fillText(`COMBO x${p.comboStep}`, 270, 102);
      }

      // Top-Center Floor Indicator
      ctx.fillStyle = 'rgba(10, 5, 14, 0.72)';
      ctx.fillRect(GAME_WIDTH * 0.5 - 155, 12, 310, 38);
      ctx.strokeStyle = '#523b47';
      ctx.strokeRect(GAME_WIDTH * 0.5 - 155, 12, 310, 38);
      ctx.textAlign = 'center';
      ctx.font = 'bold 13px "Georgia", serif';
      ctx.fillStyle = '#ffe17d';
      ctx.fillText(lvl.name, GAME_WIDTH * 0.5, 27);
      ctx.font = '11px "Courier New", monospace';
      ctx.fillStyle = '#bfb0c4';
      ctx.fillText(lvl.subtitle, GAME_WIDTH * 0.5, 42);

      // Top-Right Minimap
      this.renderMinimap(ctx, game);

      // Boss Health Bar (Bottom Center when Boss is alive & engaged)
      const boss = game.enemies.find(e => e.isBoss && !e.dead);
      if (boss && boss.bossRoared) {
        const bw = 480;
        const bh = 20;
        const bx = GAME_WIDTH * 0.5 - bw * 0.5;
        const by = GAME_HEIGHT - 54;
        ctx.fillStyle = 'rgba(12, 4, 10, 0.85)';
        ctx.fillRect(bx - 12, by - 24, bw + 24, 52);
        ctx.strokeStyle = '#9e1931';
        ctx.lineWidth = 2;
        ctx.strokeRect(bx - 12, by - 24, bw + 24, 52);

        this.drawGothicText(ctx, 'MALAKOR, LORD OF SIN', GAME_WIDTH * 0.5, by - 11, 14, '#ffcf54', '#a8182e');

        ctx.fillStyle = '#26060d';
        ctx.fillRect(bx, by, bw, bh);
        const ratio = MathUtil.clamp(boss.hp / boss.maxHp, 0, 1);
        const bg = ctx.createLinearGradient(bx, by, bx + bw, by);
        bg.addColorStop(0, '#850b1f');
        bg.addColorStop(0.5, '#d9213a');
        bg.addColorStop(1, '#ff772b');
        ctx.fillStyle = bg;
        ctx.fillRect(bx, by, Math.ceil(bw * ratio), bh);
        ctx.strokeStyle = '#d99e42';
        ctx.strokeRect(bx, by, bw, bh);
      }

      // Control Hints Bar at very bottom
      if (game.showHints) {
        ctx.fillStyle = 'rgba(8, 4, 12, 0.72)';
        ctx.fillRect(0, GAME_HEIGHT - 22, GAME_WIDTH, 22);
        ctx.font = '11px "Courier New", monospace';
        ctx.fillStyle = '#c4b5c9';
        ctx.textAlign = 'center';
        ctx.fillText(
          'WASD/Arrows: Move  |  Space/W: Double Jump/Wall Jump  |  Shift: Run/Dash  |  Z/J: Sword Combo  |  X/K: Magic  |  C/L: Nova  |  P/Esc: Pause  |  H: Hide Hints',
          GAME_WIDTH * 0.5,
          GAME_HEIGHT - 7
        );
      }

      // Portal proximity hint
      if (lvl.portal && lvl.portal.active) {
        const distPortal = MathUtil.dist(p.cx, p.cy, lvl.portal.x + 21, lvl.portal.y + 34);
        if (distPortal < 95) {
          this.drawGothicText(ctx, 'ENTER PORTAL [ENTER / WALK IN]', lvl.portal.x + 21 - game.cam.x, lvl.portal.y - 18 - game.cam.y, 13, '#9be2ff', '#388cff');
        }
      }
    }

    renderMinimap(ctx, game) {
      const lvl = game.level;
      const mapW = 164;
      const mapH = 56;
      const mx = GAME_WIDTH - mapW - 14;
      const my = 12;

      ctx.fillStyle = 'rgba(8, 4, 12, 0.82)';
      ctx.fillRect(mx, my, mapW, mapH);
      ctx.strokeStyle = '#5a4352';
      ctx.lineWidth = 2;
      ctx.strokeRect(mx, my, mapW, mapH);

      const scaleX = mapW / lvl.cols;
      const scaleY = mapH / lvl.rows;

      for (let r = 0; r < lvl.rows; r++) {
        for (let c = 0; c < lvl.cols; c++) {
          const t = lvl.grid[r][c];
          if (t === 1) {
            ctx.fillStyle = lvl.theme === 'caverns' ? '#5e2930' : '#4f4661';
            ctx.fillRect(mx + c * scaleX, my + r * scaleY, Math.ceil(scaleX), Math.ceil(scaleY));
          } else if (t === 2) {
            ctx.fillStyle = '#856146';
            ctx.fillRect(mx + c * scaleX, my + r * scaleY, Math.ceil(scaleX), Math.max(1, scaleY * 0.5));
          } else if (t === 4) {
            ctx.fillStyle = '#ff571a';
            ctx.fillRect(mx + c * scaleX, my + r * scaleY, Math.ceil(scaleX), Math.ceil(scaleY));
          }
        }
      }

      // Enemies on minimap
      ctx.fillStyle = '#ff384c';
      for (const e of game.enemies) {
        if (e.dead) continue;
        const ex = mx + (e.cx / lvl.pixelWidth) * mapW;
        const ey = my + (e.cy / lvl.pixelHeight) * mapH;
        ctx.fillRect(ex - 1, ey - 1, e.isBoss ? 4 : 2, e.isBoss ? 4 : 2);
      }

      // Portal on minimap
      if (lvl.portal && lvl.portal.active) {
        const px = mx + ((lvl.portal.x + 21) / lvl.pixelWidth) * mapW;
        const py = my + ((lvl.portal.y + 34) / lvl.pixelHeight) * mapH;
        ctx.fillStyle = '#66d9ff';
        ctx.fillRect(px - 2, py - 3, 4, 6);
      }

      // Player dot
      const ppx = mx + (game.player.cx / lvl.pixelWidth) * mapW;
      const ppy = my + (game.player.cy / lvl.pixelHeight) * mapH;
      ctx.fillStyle = '#ffe169';
      ctx.fillRect(ppx - 2, ppy - 2, 4, 4);
    }

    renderOverlayScreen(ctx, type, game, time) {
      ctx.fillStyle = 'rgba(5, 2, 8, 0.78)';
      ctx.fillRect(0, 0, GAME_WIDTH, GAME_HEIGHT);

      if (type === GAME_STATES.PAUSED) {
        this.drawGothicText(ctx, 'PAUSED', GAME_WIDTH * 0.5, 190, 48, '#ffe17d', '#8c172b');
        this.drawGothicText(ctx, 'Press ESC / P to Resume', GAME_WIDTH * 0.5, 265, 18, '#e6d8c5');
        this.drawGothicText(ctx, 'Press R to Restart  |  Press M to Mute Audio', GAME_WIDTH * 0.5, 305, 15, '#b09eb5');
      } else if (type === GAME_STATES.DEAD) {
        this.drawGothicText(ctx, 'YOU DIED', GAME_WIDTH * 0.5, 185, 68, '#d91e34', '#ff0022');
        this.drawGothicText(ctx, 'The darkness claimed your soul...', GAME_WIDTH * 0.5, 248, 18, '#c7b5bc');
        this.drawGothicText(ctx, `Score: ${game.player.score}   |   Kills: ${game.player.kills}   |   Hero Level: ${game.player.level}`, GAME_WIDTH * 0.5, 296, 16, '#ffe17d');
        const pulse = 0.55 + Math.sin(time * 5) * 0.45;
        ctx.save();
        ctx.globalAlpha = pulse;
        this.drawGothicText(ctx, 'PRESS ENTER OR R TO RETRY', GAME_WIDTH * 0.5, 370, 22, '#ffe17d', '#a8182e');
        ctx.restore();
      } else if (type === GAME_STATES.VICTORY) {
        this.drawGothicText(ctx, 'VICTORY!', GAME_WIDTH * 0.5, 160, 66, '#ffe17d', '#ff771a');
        this.drawGothicText(ctx, 'Malakor, Lord of Sin, has been vanquished!', GAME_WIDTH * 0.5, 225, 20, '#f5dec2');
        this.drawGothicText(ctx, `Final Score: ${game.player.score}   |   Monsters Slain: ${game.player.kills}   |   Knight Level: ${game.player.level}`, GAME_WIDTH * 0.5, 275, 16, '#9be2ff');
        this.drawGothicText(ctx, `Completion Time: ${game.runTime.toFixed(1)}s`, GAME_WIDTH * 0.5, 310, 15, '#c7b5bc');
        const pulse = 0.55 + Math.sin(time * 5) * 0.45;
        ctx.save();
        ctx.globalAlpha = pulse;
        this.drawGothicText(ctx, 'PRESS ENTER TO PLAY AGAIN', GAME_WIDTH * 0.5, 385, 20, '#ffe17d', '#a8182e');
        ctx.restore();
      }
    }
  }


  // ============================================================================
  // 13. MAIN GAME ENGINE, CAMERA, TRANSITIONS & STATE MACHINE
  // ============================================================================
  class SinCastleGame {
    constructor() {
      this.canvas = document.getElementById('gameCanvas');
      this.ctx = this.canvas.getContext('2d');
      this.ctx.imageSmoothingEnabled = false;

      this.input = new InputManager();
      this.audio = new AudioEngine();
      this.atlas = new PixelArtAtlas();
      this.particles = new ParticleSystem();
      this.worldRenderer = new WorldRenderer();
      this.ui = new UIRenderer();

      this.state = GAME_STATES.MENU;
      this.showControls = false;
      this.showHints = true;

      this.levelIndex = 0;
      this.level = null;
      this.player = null;
      this.enemies = [];
      this.projectiles = [];
      this.loots = [];

      this.cam = { x: 0, y: 0 };
      this.shakeMag = 0;
      this.shakeTime = 0;

      // Fade transition between rooms
      this.fadeAlpha = 0;
      this.transitionPhase = 'none'; // 'out' | 'in' | 'none'
      this.pendingLevelIndex = 0;
      this.pendingNextState = null;

      this.time = 0;
      this.runTime = 0;
      this.lastTimestamp = performance.now();

      this.resizeCanvas();
      window.addEventListener('resize', () => this.resizeCanvas());
      requestAnimationFrame((ts) => this.loop(ts));
    }

    resizeCanvas() {
      const ww = window.innerWidth;
      const wh = window.innerHeight;
      const aspect = GAME_WIDTH / GAME_HEIGHT;
      let targetW = ww;
      let targetH = Math.floor(ww / aspect);
      if (targetH > wh) {
        targetH = wh;
        targetW = Math.floor(wh * aspect);
      }
      this.canvas.style.width = `${targetW}px`;
      this.canvas.style.height = `${targetH}px`;
    }

    addScreenShake(mag, duration) {
      this.shakeMag = Math.max(this.shakeMag, mag);
      this.shakeTime = Math.max(this.shakeTime, duration);
    }

    startNewRun() {
      this.audio.init();
      this.runTime = 0;
      this.levelIndex = 0;
      this.player = new Player(96, 350);
      this.loadFloor(0);
      this.state = GAME_STATES.PLAYING;
      this.fadeAlpha = 1;
      this.transitionPhase = 'in';
    }

    loadFloor(index) {
      this.levelIndex = index;
      this.level = new Level(index);
      this.particles.clear();
      this.projectiles = [];
      this.loots = [];
      this.enemies = [];

      this.player.x = this.level.spawnX;
      this.player.y = this.level.spawnY;
      this.player.vx = 0;
      this.player.vy = 0;
      this.player.hp = Math.min(this.player.maxHp, this.player.hp + 25);
      this.player.mana = this.player.maxMana;

      for (const sp of this.level.enemySpawns) {
        this.enemies.push(createEnemyByType(sp.type, sp.x, sp.y));
      }

      this.cam.x = MathUtil.clamp(this.player.cx - GAME_WIDTH * 0.5, 0, Math.max(0, this.level.pixelWidth - GAME_WIDTH));
      this.cam.y = MathUtil.clamp(this.player.cy - GAME_HEIGHT * 0.5, 0, Math.max(0, this.level.pixelHeight - GAME_HEIGHT));

      this.audio.setTrack(index === 0 ? 'castle' : (index === 1 ? 'caverns' : 'boss'));
      this.particles.addText(this.player.cx, this.player.y - 26, this.level.name, '#ffe17d', 16);
    }

    beginFloorTransition(nextFloorIndex, nextState = GAME_STATES.PLAYING) {
      if (this.transitionPhase !== 'none') return;
      this.audio.playPortal();
      this.transitionPhase = 'out';
      this.pendingLevelIndex = nextFloorIndex;
      this.pendingNextState = nextState;
      this.state = GAME_STATES.TRANSITION;
    }

    onBossDefeated() {
      if (this.level && this.level.portal) {
        this.level.portal.active = true;
      }
      this.particles.addText(this.player.cx, this.player.y - 40, 'PORTAL UNLOCKED!', '#ffe17d', 18);
    }

    spawnProjectile(opts) {
      this.projectiles.push(new Projectile(opts));
    }

    loop(timestamp) {
      const rawDt = (timestamp - this.lastTimestamp) / 1000;
      this.lastTimestamp = timestamp;
      const dt = Math.min(rawDt, 0.05); // clamp dt for stability

      this.update(dt);
      this.render();
      this.input.endFrame();

      requestAnimationFrame((ts) => this.loop(ts));
    }

    update(dt) {
      this.time += dt;
      this.input.update(dt);
      this.audio.updateMusic(dt);

      if (this.input.mutePressed()) {
        this.audio.init();
        this.audio.toggleMute();
      }
      if (this.input.hintsTogglePressed()) {
        this.showHints = !this.showHints;
      }
      if (this.input.isKeyPressed('KeyT')) {
        this.input.toggleTouchOverlay();
      }

      if (this.state === GAME_STATES.MENU) {
        if (this.showControls) {
          if (this.input.enterPressed() || this.input.pausePressed()) {
            this.showControls = false;
          }
          return;
        }
        if (this.input.upPressed()) this.ui.menuIndex = (this.ui.menuIndex + 2) % 3;
        if (this.input.downPressed()) this.ui.menuIndex = (this.ui.menuIndex + 1) % 3;
        if (this.input.enterPressed()) {
          this.audio.init();
          if (this.ui.menuIndex === 0) {
            this.startNewRun();
          } else if (this.ui.menuIndex === 1) {
            this.audio.toggleMute();
          } else {
            this.showControls = true;
          }
        }
        return;
      }

      if (this.state === GAME_STATES.PAUSED) {
        if (this.input.pausePressed()) {
          this.state = GAME_STATES.PLAYING;
        } else if (this.input.isKeyPressed('KeyR')) {
          this.startNewRun();
        }
        return;
      }

      if (this.state === GAME_STATES.DEAD || this.state === GAME_STATES.VICTORY) {
        if (this.input.enterPressed() || this.input.isKeyPressed('KeyR')) {
          this.startNewRun();
        }
        return;
      }

      if (this.state === GAME_STATES.TRANSITION) {
        if (this.transitionPhase === 'out') {
          this.fadeAlpha = Math.min(1, this.fadeAlpha + dt * 2.2);
          if (this.fadeAlpha >= 1) {
            if (this.pendingNextState === GAME_STATES.VICTORY) {
              this.state = GAME_STATES.VICTORY;
              this.transitionPhase = 'in';
            } else {
              this.loadFloor(this.pendingLevelIndex);
              this.state = GAME_STATES.PLAYING;
              this.transitionPhase = 'in';
            }
          }
        }
        return;
      }

      // GAME_STATES.PLAYING
      if (this.input.pausePressed()) {
        this.state = GAME_STATES.PAUSED;
        return;
      }

      this.runTime += dt;

      if (this.transitionPhase === 'in') {
        this.fadeAlpha = Math.max(0, this.fadeAlpha - dt * 2.2);
        if (this.fadeAlpha <= 0) this.transitionPhase = 'none';
      }

      this.worldRenderer.update(dt);
      this.level.update(dt, this.particles);
      this.player.update(dt, this.input, this.level, this);

      if (this.player.dead) {
        this.state = GAME_STATES.DEAD;
        return;
      }

      for (let i = this.enemies.length - 1; i >= 0; i--) {
        const e = this.enemies[i];
        e.update(dt, this.level, this);
        if (e.dead) this.enemies.splice(i, 1);
      }

      for (let i = this.projectiles.length - 1; i >= 0; i--) {
        const p = this.projectiles[i];
        p.update(dt, this.level, this);
        if (p.dead) this.projectiles.splice(i, 1);
      }

      for (let i = this.loots.length - 1; i >= 0; i--) {
        const l = this.loots[i];
        l.update(dt, this.level, this);
        if (l.dead) this.loots.splice(i, 1);
      }

      this.particles.update(dt, this.level);

      // Check Portal entry to descend deeper
      const portal = this.level.portal;
      if (portal && portal.active && MathUtil.aabb(this.player.rect, portal)) {
        if (this.levelIndex < 2) {
          this.beginFloorTransition(this.levelIndex + 1, GAME_STATES.PLAYING);
        } else {
          this.beginFloorTransition(2, GAME_STATES.VICTORY);
        }
      }

      // Smooth camera follow + lookahead
      const targetCamX = MathUtil.clamp(
        this.player.cx + this.player.facing * 55 - GAME_WIDTH * 0.5,
        0,
        Math.max(0, this.level.pixelWidth - GAME_WIDTH)
      );
      const targetCamY = MathUtil.clamp(
        this.player.cy - GAME_HEIGHT * 0.54,
        0,
        Math.max(0, this.level.pixelHeight - GAME_HEIGHT)
      );
      this.cam.x = MathUtil.lerp(this.cam.x, targetCamX, Math.min(1, dt * 8));
      this.cam.y = MathUtil.lerp(this.cam.y, targetCamY, Math.min(1, dt * 7));

      if (this.shakeTime > 0) {
        this.shakeTime -= dt;
        if (this.shakeTime <= 0) this.shakeMag = 0;
      }
    }

    render() {
      const ctx = this.ctx;
      ctx.clearRect(0, 0, GAME_WIDTH, GAME_HEIGHT);

      if (this.state === GAME_STATES.MENU) {
        this.ui.renderTitleScreen(ctx, this.time, 0.016, this.audio.muted, this.showControls);
        return;
      }

      // Compute camera shake offset
      const shakeX = this.shakeTime > 0 ? MathUtil.rand(-this.shakeMag, this.shakeMag) : 0;
      const shakeY = this.shakeTime > 0 ? MathUtil.rand(-this.shakeMag, this.shakeMag) : 0;
      const renderCam = {
        x: Math.floor(this.cam.x + shakeX),
        y: Math.floor(this.cam.y + shakeY)
      };

      // 1. Parallax Sky, Moon, Lightning, Cathedral Towers
      this.worldRenderer.renderParallaxBackground(ctx, renderCam, this.level, this.time);

      // 2. Castle Arches, Chains, Blood Pools, Torches, Portal
      this.level.renderBackgroundDecor(ctx, renderCam, this.atlas, this.time);

      // 3. Level Tiles & Moving Platforms
      this.level.renderTiles(ctx, renderCam, this.atlas, this.time);

      // 4. Blood Decals
      this.particles.renderDecals(ctx, renderCam);

      // 5. Loot Drops
      for (const l of this.loots) l.render(ctx, renderCam, this.atlas);

      // 6. Enemies & Boss
      for (const e of this.enemies) e.render(ctx, renderCam, this.atlas);

      // 7. Player Hero
      if (!this.player.dead) this.player.render(ctx, renderCam, this.atlas);

      // 8. Projectiles
      for (const p of this.projectiles) p.render(ctx, renderCam);

      // 9. Particles, Slash Arcs, Floating Damage Text
      this.particles.render(ctx, renderCam);

      // 10. Dynamic Lighting & Torch Glow Overlay
      this.worldRenderer.renderLighting(ctx, renderCam, this.level, this.player, this.projectiles, this.time);

      // 11. HUD & Minimap
      this.ui.renderHUD(ctx, this);

      // 12. Overlays (Pause / Death / Victory)
      if (this.state === GAME_STATES.PAUSED || this.state === GAME_STATES.DEAD || this.state === GAME_STATES.VICTORY) {
        this.ui.renderOverlayScreen(ctx, this.state, this, this.time);
      }

      // 13. Room Fade Transition
      if (this.fadeAlpha > 0) {
        ctx.fillStyle = `rgba(4, 2, 6, ${this.fadeAlpha})`;
        ctx.fillRect(0, 0, GAME_WIDTH, GAME_HEIGHT);
      }
    }
  }

  // Boot Sin Castle
  window.addEventListener('DOMContentLoaded', () => {
    window.__sinCastle = new SinCastleGame();
  });
})();
</script>
</body>
